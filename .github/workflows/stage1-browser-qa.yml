name: Stage 1 browser QA
on:
  pull_request:
    branches: [main]
concurrency:
  group: stage1-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-game.mjs && node tests/experiment-records.cjs && node tests/measurement-lifecycle.cjs
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - name: Minimal Chromium startup
        run: timeout --kill-after=15s 90s npx playwright test --config=playwright.config.cjs --grep 'minimal Chromium'
        working-directory: tests/browser
        env:
          QA_PHASE: smoke
      - name: Complete stage across four widths
        run: timeout --kill-after=15s 420s npx playwright test --config=playwright.config.cjs --grep 'stage one complete'
        working-directory: tests/browser
        env:
          QA_PHASE: complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-browser-evidence-${{ github.sha }}
          path: |
            tests/browser/reports/
            tests/browser/test-results/
            tests/browser/playwright-report/
          retention-days: 14
