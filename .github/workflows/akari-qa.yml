name: Akari Quest QA
on:
  pull_request:
    paths:
      - 'games/akari/**'
      - 'scripts/test-akari.mjs'
      - 'tests/akari-switch-focus.test.cjs'
      - 'scripts/test-akari-browser.mjs'
      - 'scripts/build-akari-preview.mjs'
      - '.github/workflows/akari-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check games/akari/game.js
          node --check games/akari/art.js
          node --check games/akari/scenes.js
          node --check games/akari/bridge-panorama.js
          node --check games/akari/cute-town.js
          node --check games/akari/character.js
          node --check games/akari/transfer.js
          node --check games/akari/builder.js
          node --check games/akari/switch-lab.js
          node --check games/akari/wire-cut.js
          node --check tests/akari-switch-focus.test.cjs
          node --check scripts/test-akari-browser.mjs
          node --check scripts/build-akari-preview.mjs
      - name: Check switch circuit regression cases
        run: node --test tests/akari-switch-focus.test.cjs
      - name: Run full 14-mission simulation
        run: node scripts/test-akari.mjs
      - name: Install Playwright and browsers
        timeout-minutes: 10
        env:
          CI: 'true'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify real mobile / desktop interactions
        run: node scripts/test-akari-browser.mjs
      - name: Build self-contained playable preview
        if: always()
        env:
          AKARI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/build-akari-preview.mjs
      - name: Upload playable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-playable-preview
          path: artifacts/akari-preview.html
          if-no-files-found: error
      - name: Save diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-visual-qa
          path: artifacts/akari/
          if-no-files-found: ignore
