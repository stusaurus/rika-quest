name: Akari Quest QA
on:
  pull_request:
    paths:
      - 'games/akari/**'
      - 'scripts/test-akari.mjs'
      - 'tests/akari-switch-focus.test.cjs'
      - 'scripts/test-akari-browser.mjs'
      - 'scripts/test-akari-cinematic.mjs'
      - 'scripts/test-akari-painted.mjs'
      - 'scripts/test-akari-delivery.mjs'
      - 'scripts/build-akari-art-baseline.mjs'
      - 'scripts/build-akari-preview.mjs'
      - '.github/workflows/akari-qa.yml'
  workflow_dispatch:
    inputs:
      online_review_url:
        description: 'Optional deployed review URL; must serve the tested HTML without an authentication wall'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check games/akari/game.js
          node --check games/akari/reference-layout.js
          node --check games/akari/side-drawers.js
          node --check games/akari/free-lab-model.js
          node --check games/akari/free-lab.js
          node --check games/akari/art.js
          node --check games/akari/scenes.js
          node --check games/akari/bridge-panorama.js
          node --check games/akari/cute-town.js
          node --check games/akari/cinematic-scenery.js
          node --check games/akari/mission1-art.js
          node --check games/akari/circuit-village.js
          node --check games/akari/character.js
          node --check games/akari/transfer.js
          node --check games/akari/builder.js
          node --check games/akari/switch-lab.js
          node --check games/akari/wire-cut.js
          node --check tests/akari-switch-focus.test.cjs
          node --check scripts/test-akari-browser.mjs
          node --check scripts/test-akari-cinematic.mjs
          node --check scripts/test-akari-painted.mjs
          node --check scripts/test-akari-delivery.mjs
          node --check scripts/build-akari-preview.mjs
      - name: Check switch circuit regression cases
        run: node --test tests/akari-switch-focus.test.cjs
      - name: Run full 14-mission simulation
        run: node scripts/test-akari.mjs
      - name: Install matching Playwright client
        timeout-minutes: 5
        env:
          CI: 'true'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify real mobile / desktop interactions
        run: node scripts/test-akari-browser.mjs
      - name: Verify cinematic game direction separately from current published UI
        run: node scripts/test-akari-cinematic.mjs
      - name: Build self-contained playable preview
        if: always()
        env:
          AKARI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AKARI_REVIEW_URL: https://akari-mission1-review-20261112.jyoker.chatgpt.site/
        run: node scripts/build-akari-preview.mjs
      - name: Upload playable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-playable-preview
          path: artifacts/akari-preview.html
          if-no-files-found: error
      - name: Save diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-visual-qa
          path: artifacts/akari/
          if-no-files-found: ignore
  painted-mission1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright client
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Build identical offline art preview
        env:
          AKARI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          AKARI_REVIEW_URL: https://akari-mission1-review-20261112.jyoker.chatgpt.site/
        run: node scripts/build-akari-preview.mjs
      - name: Prepare immutable PR35 art comparison
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" fetch --depth=1 origin bec6d99f67f40818266c855e7ee28435ade0be78
          node scripts/build-akari-art-baseline.mjs
      - name: Operate painted mission 1 in Chromium and WebKit
        run: node scripts/test-akari-painted.mjs
      - name: Upload painted playable preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-mission1-painted-preview
          path: artifacts/akari-mission1-painted.html
          if-no-files-found: error
      - name: Upload painted comparison and operation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-mission1-painted-qa
          path: artifacts/akari/
          if-no-files-found: ignore
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      AKARI_REVIEW_URL: https://akari-mission1-review-20261112.jyoker.chatgpt.site/
      AKARI_DELIVERY_ONLINE_URL: ${{ inputs.online_review_url || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright client
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Build identical online and offline review
        env:
          AKARI_PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/build-akari-preview.mjs
      - name: Operate delivered HTML over file and HTTP, including saves
        run: node scripts/test-akari-delivery.mjs
      - name: Save delivery results and actual game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akari-delivery-qa
          path: artifacts/akari-delivery/
          if-no-files-found: error
