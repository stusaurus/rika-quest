name: Village workshop review
on:
  pull_request:
    paths: ['games/akari/**','scripts/*workshops.mjs','scripts/*akari-netlify-three.mjs','tests/fixtures/akari-workshop-actions.json','.github/workflows/akari-workshops.yml']
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: [320, 390, 768, 1024, 1440]
        include:
          - engine: chromium
            width: 768
            before: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: node scripts/build-akari-workshops.mjs
      - name: Traverse approved baseline
        if: matrix.before
        run: BASELINE=1 node scripts/test-akari-workshops.mjs
        env:
          ENGINE: chromium
          WIDTH: 768
      - name: Traverse standalone candidate
        if: success() || failure()
        run: node scripts/test-akari-workshops.mjs
        env:
          WIDTH: ${{ matrix.width }}
          ENGINE: ${{ matrix.engine }}
      - name: Compare actual tablet captures
        if: matrix.before && success()
        run: node scripts/compare-akari-workshops.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-${{ matrix.engine }}-${{ matrix.width }}
          path: artifacts/workshop-*/
      - uses: actions/upload-artifact@v4
        if: matrix.before
        with:
          name: review-html
          path: artifacts/akari-fourteen.html

  trial-three:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        width: [390, 768]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: node scripts/build-akari-workshops.mjs
      - run: node scripts/build-akari-netlify-three.mjs
      - name: Play through anonymous first-three-mission scope
        run: node scripts/test-akari-netlify-three.mjs
        env:
          ENGINE: ${{ matrix.engine }}
          WIDTH: ${{ matrix.width }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trial-three-qa-${{ matrix.engine }}-${{ matrix.width }}
          path: artifacts/three-review-*/
      - uses: actions/upload-artifact@v4
        if: matrix.engine == 'chromium' && matrix.width == 768
        with:
          name: netlify-akari-three-static
          path: artifacts/netlify-akari-three/
          include-hidden-files: true
