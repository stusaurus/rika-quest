import {POSITIONS, inspectBar, referenceExperiment, tryGate, STAGE} from './engine.mjs';
import {PROBE_STOPS, clamp, probeFromX, distanceFromX, xFromDistance, svgXFromClient} from './interaction.mjs';
const KEY = 'rika-quest-magnet-stage1-v1';
const el = id => document.getElementById(id);
const app = el('app'), controls = el('controls'), status = el('status'), svg=app.querySelector('svg.scenery');
const initial = () => ({phase:0,probes:[],ref:[],pole:null,distance:4,attempts:0,message:'まずは棒磁石の3か所を調べよう。'});
let state = initial();
try {
 const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
 if(saved && Number.isInteger(saved.phase) && saved.phase>=0 && saved.phase<=4) {
   state={...initial(),...saved};
   state.probes=Array.isArray(saved.probes)?saved.probes.filter(id=>POSITIONS.some(p=>p.id===id)):[];
   state.ref=Array.isArray(saved.ref)?saved.ref.filter(side=>side==='left'||side==='right'):[];
   state.distance=[1,2,3,4,5].includes(Number(saved.distance))?Number(saved.distance):4;
   state.pole=saved.pole==='N'||saved.pole==='S'?saved.pole:null;
   state.message='前の実験から再開しました。';
 }
} catch (e) { console.info('Saved game unavailable',e); }
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){console.info('Save unavailable',e);}}
const seen = id => state.probes.includes(id);
const probesComplete = () => STAGE.requiredProbes.every(seen);
const referenceComplete = () => state.ref.includes('left')&&state.ref.includes('right');
function choice(label,action,value,selected=false,small=''){
 const attr = selected ? ' selected' : '';
 return '<button class="choice'+attr+'" type="button" data-action="'+action+'" data-value="'+value+'" aria-pressed="'+selected+'">'+label+(small?'<small>'+small+'</small>':'')+'</button>';
}
function observations(){
 return '<div class="observations" aria-label="調べた結果">'+POSITIONS.filter(p=>seen(p.id)).map(p=>'<span class="obs">'+p.label+'：<strong>'+inspectBar(p.id).intensity+'</strong></span>').join('')+'</div>';
}
function setMessage(message){state.message=message;save();status.textContent=message;}
function phaseTo(n,message){
 state.phase=n;state.message=message;save();render();el('task').focus({preventScroll:true});
}
// Small fragments of iron respond as a *qualitative illustration*, not a force calculation.
const filings=Array.from({length:24},(_,index)=>{
 const node=document.createElementNS('http://www.w3.org/2000/svg','path');
 node.setAttribute('class','filing');
 el('filing-dots').append(node);
 return node;
});
let probeX=390, referenceX=215, gateX=527.5;
function setProbeVisual(x){
 probeX=clamp(x,390,591);
 el('probe-lens').setAttribute('transform','translate('+probeX.toFixed(1)+' 0)');
 const id=probeFromX(probeX),stop=PROBE_STOPS.find(p=>p.id===id);
 el('probe-lens').setAttribute('aria-valuenow',String(PROBE_STOPS.indexOf(stop)+1));
 el('probe-lens').setAttribute('aria-valuetext',POSITIONS.find(p=>p.id===id).label);
 const level=inspectBar(id).response;
 filings.forEach((node,i)=>{
   const visible=i<(level===5?24:level===3?15:7);
   const radial=8+(i%7)*3.1, angle=i*2.399963+Math.floor(i/8)*.27;
   const xx=probeX+Math.cos(angle)*radial;
   const yy=407+Math.sin(angle)*Math.min(radial*.43,10);
   const tilt=Math.sin(angle)*5;
   node.setAttribute('d','M'+(xx-2.1).toFixed(1)+' '+(yy-tilt).toFixed(1)+'l4.2 '+(2*tilt).toFixed(1));
   node.setAttribute('opacity',visible?(.5+(i%4)*.12).toFixed(2):'0');
 });
}
function setReferenceVisual(x){
 referenceX=clamp(x,195,660);
 el('reference-magnet').setAttribute('transform','translate('+referenceX.toFixed(1)+' 420)');
}
function setGateVisual(x){
 gateX=clamp(x,470,700);
 const distance=distanceFromX(gateX);
 el('gate-magnet').setAttribute('transform','translate('+gateX.toFixed(1)+' 0)');
 el('gate-magnet').setAttribute('aria-valuenow',String(distance));
 el('gate-magnet').setAttribute('aria-valuetext',distance+'cm');
 el('gate-magnet-pole').textContent=state.pole||'?';
 el('gate-magnet-shell').setAttribute('fill',state.pole==='N'?'#a73b54':state.pole==='S'?'#287caa':'#516f83');
 el('force-waves').dataset.reaction=state.pole==='N'?'repel':state.pole==='S'?'attract':'neutral';
 const range=el('distance');
 if(range)range.value=String(distance);
 const output=el('distance-value');
 if(output)output.textContent=distance+' cm';
}
function recordProbe(id){
 if(state.phase!==0)return;
 if(!state.probes.includes(id))state.probes.push(id);
 state.lastProbe=id;
 const found=inspectBar(id);
 setMessage(found.label+'では鉄片が「'+found.intensity+'」反応した。ほかの場所も比べよう。');
 render();
}
function recordReference(side){
 if(state.phase!==2)return;
 if(!state.ref.includes(side))state.ref.push(side);
 state.lastReference=side;
 const response=referenceExperiment(side).reaction;
 setMessage((side==='left'?'左端':'右端')+'にN極を近づけると、'+(response==='repel'?'反発した！':'引き合った！'));
 render();
}
function render(){
 app.dataset.phase=String(state.phase);
 el('progress').innerHTML=Array.from({length:5},(_,i)=>'<i class="'+(i<=state.phase?'done':'')+'"></i>').join('');
 const texts=[
  ['MISSION 01 · かんさつ','磁石のどこに鉄片が集まる？','光る検査器を左右へドラッグして、鉄片の反応の違いを調べよう。下のボタンでも操作できます。'],
  ['MISSION 02 · 発見','観察から「極」を見つけよう','調べた結果をもとに、鉄片が最もよく集まる場所を選ぼう。'],
  ['MISSION 03 · じっけん','「N極」を手がかりに見分けよう','赤いN極磁石をドラッグして左右の端へ。引き合うか反発するか調べよう。下のボタンでも操作できます。'],
  ['MISSION 04 · 応用','磁力の門をひらこう','極を選び、門の前の磁石をドラッグして近づけよう。距離スライダーでも調整できます。'],
  ['STAGE 01 · CLEAR','磁力の門が目覚めた！','観察と実験で発見したことが、扉を動かす力になった。']
 ][state.phase];
 el('kicker').textContent=texts[0];el('task').textContent=texts[1];el('prompt').textContent=texts[2];
 el('tag').textContent=state.phase===4?'実験成功':'実験で発見';
 el('pole-left').textContent=state.phase>=3?'N':'?';
 el('pole-right').textContent=state.phase>=3?'S':'?';
 el('field-caption').textContent=state.phase===0?'中央の棒磁石には、まだ N・S の印がない':state.phase===2?'N極を左右へ近づけ、引力と反発を比べよう':state.phase>=3?'門の赤い印はN極。どちらを向ければよい？':'棒磁石の両端に、鉄片が多く集まった';
 setProbeVisual(PROBE_STOPS.find(p=>p.id===state.lastProbe)?.x ?? PROBE_STOPS[0].x);
 setReferenceVisual(state.lastReference==='left'?265:state.lastReference==='right'?625:215);
 const reaction=state.phase===2&&state.lastReference?referenceExperiment(state.lastReference).reaction:null;
 el('reaction-indicator').setAttribute('opacity',reaction?'1':'0');
 el('reaction-indicator').setAttribute('transform','translate('+(state.lastReference==='right'?672:310)+' 373)');
 el('reaction-label').textContent=reaction==='repel'?'反発！':'引き合う！';
 setGateVisual(xFromDistance(state.distance));
 el('probe-lens').setAttribute('tabindex',state.phase===0?'0':'-1');
 el('reference-magnet').setAttribute('tabindex',state.phase===2?'0':'-1');
 el('gate-magnet').setAttribute('tabindex',state.phase===3?'0':'-1');
 let body='';
 if(state.phase===0){
   body='<div class="action-grid">'+POSITIONS.map(p=>choice(p.label, 'probe',p.id,seen(p.id),seen(p.id)?'記録ずみ':'調べる')).join('')+'</div>'+
        observations()+'<div class="tools"><span style="font-size:12px;color:#b6cee0">左右の端と中央は必ず調べよう</span><button class="primary" type="button" data-action="next" '+(probesComplete()?'':'disabled')+'>結果をまとめる →</button></div>';
 }else if(state.phase===1){
   body=observations()+'<p style="margin:16px 0 10px;color:#ffe0ad;font-weight:900">鉄片がもっともよく集まるのはどこ？</p>'+
        '<div class="action-grid">'+choice('ひだりのはし','answer','left')+choice('まんなか','answer','center')+choice('りょうはし','answer','both')+'</div>';
 }else if(state.phase===2){
   body='<div class="action-grid">'+
     choice('左のはしで実験','reference','left',state.ref.includes('left'),state.ref.includes('left')?'結果を記録':'N極を近づける')+
     choice('右のはしで実験','reference','right',state.ref.includes('right'),state.ref.includes('right')?'結果を記録':'N極を近づける')+'</div>'+
     '<div class="observations">'+state.ref.map(side=>'<span class="obs">'+(side==='left'?'左端':'右端')+'：<strong>'+(referenceExperiment(side).reaction==='repel'?'反発した':'引き合った')+'</strong></span>').join('')+'</div>'+
     (referenceComplete()?'<p style="margin:16px 0 8px;color:#ffe0ad;font-weight:900">では、左のはしは何極？</p><div class="action-grid">'+choice('N極','identify','N')+choice('S極','identify','S')+'</div>':'<p style="font-size:12px;color:#d1e1f2">まずは左右の両方で試してみよう。</p>');
 }else if(state.phase===3){
   body='<div class="action-grid">'+
     choice('赤い N極を近づける','pick','N',state.pole==='N')+
     choice('青い S極を近づける','pick','S',state.pole==='S')+'</div>'+
     '<div class="slider-wrap"><label for="distance">門との距離</label><input type="range" min="1" max="5" step="1" id="distance" value="'+state.distance+'"><output id="distance-value" for="distance">'+state.distance+' cm</output></div>'+
     '<div class="tools"><span style="font-size:12px;color:#bed9e9">門の極：<strong style="color:#f7cdb2">N極</strong></span><button class="primary" type="button" data-action="gate" '+(state.pole?'':'disabled')+'>磁力を試す →</button></div>';
 }else{
   body='<span class="clear-flag">✦ STAGE CLEAR</span><div class="discovery">'+
    '<b>発見①</b> 棒磁石は両端の極で、鉄がよく引き寄せられる。<br>'+
    '<b>発見②</b> 同じ極どうしは反発し、ちがう極どうしは引き合う。<br>'+
    '<b>発見③</b> 磁石の極は、引力・反発を調べて見分けられる。'+
    '</div><div class="tools"><button class="secondary" type="button" data-action="reset">はじめから実験する</button><a class="primary" href="../../" style="text-decoration:none">Rika Questにもどる</a></div>';
 }
 controls.innerHTML=body;
 status.textContent=state.message;
}
controls.addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
 const action=button.dataset.action,val=button.dataset.value;
 if(action==='probe'&&state.phase===0){
  recordProbe(val);
 }else if(action==='next'&&state.phase===0&&probesComplete()){
  phaseTo(1,'結果がそろった。両端と中央を比べてみよう。');
 }else if(action==='answer'&&state.phase===1){
  if(val==='both')phaseTo(2,'正解！ 両端を「極（磁極）」という。鉄片の集まり方だけではN・Sは区別できない。');
  else setMessage('結果をもう一度見てみよう。棒磁石の左右の端には同じように鉄片が集まったね。');
 }else if(action==='reference'&&state.phase===2){
  recordReference(val);
 }else if(action==='identify'&&state.phase===2&&referenceComplete()){
  if(val==='N')phaseTo(3,'正解！ 同じ極が反発するので、左はN極・右はS極だ。');
  else setMessage('N極を近づけたとき、反発したのはどちらだったかな？');
 }else if(action==='pick'&&state.phase===3){
  state.pole=val;setMessage((val==='N'?'N極':'S極')+'を選択。距離を変えて門で実験しよう。');render();
 }else if(action==='gate'&&state.phase===3){
  state.attempts++;
  const result=tryGate(state.pole,state.distance);
  if(result==='open'){app.classList.add('flash');phaseTo(4,'S極と門のN極が引き合い、門が開いた！');setTimeout(()=>app.classList.remove('flash'),750);}
  else if(result==='far')setMessage('距離があるので、門が動かなかった。もう少し近づけてみよう。');
  else if(result==='repel'){
    app.classList.remove('repel-hit');void app.offsetWidth;app.classList.add('repel-hit');
    setMessage('同じN極どうしは反発！ 門の磁石は近づいてこなかった。');
    setTimeout(()=>app.classList.remove('repel-hit'),650);
  }
  else setMessage('磁石を選んで実験しよう。');
 }else if(action==='reset'){
  state=initial();try{localStorage.removeItem(KEY);}catch(e){};render();el('task').focus({preventScroll:true});
 }
});
controls.addEventListener('input',event=>{
 if(event.target.id==='distance'&&state.phase===3){
  state.distance=Number(event.target.value);el('distance-value').textContent=state.distance+' cm';setGateVisual(xFromDistance(state.distance));save();
 }
});
const targets=[
 {id:'probe-lens',phase:0,kind:'probe'},
 {id:'reference-magnet',phase:2,kind:'reference'},
 {id:'gate-magnet',phase:3,kind:'gate'}
];
let gesture=null;
function moveGesture(x){
 if(!gesture)return;
 if(gesture.kind==='probe')setProbeVisual(x);
 else if(gesture.kind==='reference')setReferenceVisual(x-47);
 else if(gesture.kind==='gate')setGateVisual(x-50);
}
function commitGesture(kind){
 if(kind==='probe'){
  recordProbe(probeFromX(probeX));
 }else if(kind==='reference'){
  if(referenceX<=325)recordReference('left');
  else if(referenceX>=565)recordReference('right');
  else {setMessage('磁石の左端か右端へ近づけて、反応を比べよう。');render();}
 }else if(kind==='gate'){
  state.distance=distanceFromX(gateX);
  setMessage('門との距離は'+state.distance+' cm。磁石の極を選んで「磁力を試す」を押そう。');
  render();
 }
}
targets.forEach(({id,phase,kind})=>{
 const target=el(id);
 target.addEventListener('pointerdown',event=>{
  if(state.phase!==phase||gesture||event.button!==0)return;
  event.preventDefault();
  gesture={id,kind,pointerId:event.pointerId};
  try{target.setPointerCapture(event.pointerId);}catch(e){gesture=null;return;}
  app.classList.add('dragging');
 });
 target.addEventListener('pointermove',event=>{
  if(!gesture||gesture.id!==id||gesture.pointerId!==event.pointerId)return;
  try{moveGesture(svgXFromClient(svg,event.clientX,event.clientY));}catch(e){console.warn('Pointer coordinate unavailable',e);}
 });
 target.addEventListener('pointerup',event=>{
  if(!gesture||gesture.id!==id||gesture.pointerId!==event.pointerId)return;
  try{moveGesture(svgXFromClient(svg,event.clientX,event.clientY));}catch(e){}
  gesture=null;app.classList.remove('dragging');
  try{target.releasePointerCapture(event.pointerId);}catch(e){}
  commitGesture(kind);
 });
 target.addEventListener('pointercancel',()=>{
  if(gesture?.id===id){gesture=null;app.classList.remove('dragging');render();}
 });
 target.addEventListener('keydown',event=>{
  if(state.phase!==phase)return;
  if(kind==='probe'){
    const index=PROBE_STOPS.findIndex(p=>p.id===probeFromX(probeX));
    if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
      event.preventDefault();
      const n=clamp(index+(event.key==='ArrowRight'?1:-1),0,4);
      setProbeVisual(PROBE_STOPS[n].x);
    }else if(event.key==='Enter'||event.key===' '){event.preventDefault();recordProbe(probeFromX(probeX));}
  }else if(kind==='reference'){
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
      event.preventDefault();setReferenceVisual(event.key==='ArrowLeft'?265:625);
    }else if(event.key==='Enter'||event.key===' '){event.preventDefault();commitGesture(kind);}
  }else if(kind==='gate'){
    if(event.key==='ArrowRight'||event.key==='ArrowLeft'){
      event.preventDefault();
      state.distance=clamp(state.distance+(event.key==='ArrowLeft'?1:-1),1,5);
      save();setGateVisual(xFromDistance(state.distance));
    }
  }
 });
});
render();
</script>
</body>
</html>
