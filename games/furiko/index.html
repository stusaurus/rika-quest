<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a34"><title>フリコ・クエスト｜Rika Quest</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0,#123e66,#08182f 55%,#040b18);color:#f6f3e8;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;display:flex;align-items:center;justify-content:center;padding:26px}.box{width:min(100%,480px);padding:28px;border:1px solid #8aafc8a0;border-radius:24px;background:#091e38e8;text-align:center;box-shadow:0 25px 60px #0006}h1{font-size:1.5rem;letter-spacing:.04em}p{color:#ceddf0;line-height:1.7}.orb{font-size:3.4rem}.bar{height:10px;border-radius:10px;background:#203d5e;overflow:hidden;margin-top:22px}.bar span{display:block;background:linear-gradient(90deg,#4dc9e5,#f1d789);width:0;height:100%;transition:width .24s}small{display:block;margin:14px auto;color:#add5e2}a{color:#d2e9ff}button{padding:12px 18px;border-radius:10px;background:#f5d38c;border:0;cursor:pointer}#error{display:none;color:#ffd1b9}</style></head><body>
<div class="box" role="status" aria-live="polite"><div class="orb">✦</div><h1>フリコ・クエスト</h1><p>冒険の世界を準備しています</p><div class="bar"><span id="progress"></span></div><small id="message">ゲームを読み込み中…</small><div id="error"><p>読み込みに失敗しました。通信状態を確認して再読み込みしてください。</p><button onclick="location.reload()">もう一度試す</button></div><p><a href="../../">Rika Questへ戻る</a></p></div>
<script>
(async function(){
const p=document.getElementById('progress'),m=document.getElementById('message');
try{
const req=await fetch('./manifest.json',{cache:'no-store'});if(!req.ok)throw Error('manifest '+req.status);
const manifest=await req.json();const n=manifest.partCount;if(!Number.isInteger(n)||n<1||n>200)throw Error('invalid manifest');
const fragments=new Array(n);let next=0,loaded=0;
async function worker(){while(next<n){const i=next++;const name='part-'+String(i+1).padStart(3,'0')+'.txt';const r=await fetch('./parts/'+name);if(!r.ok)throw Error(name+' '+r.status);fragments[i]=await r.text();loaded++;p.style.width=Math.round(100*loaded/n)+'%';m.textContent='ゲームを読み込み中… '+loaded+'/'+n;}}
await Promise.all(Array.from({length:Math.min(6,n)},()=>worker()));
const game=fragments.join('');if(game.length!==manifest.totalChars||!game.startsWith('<!doctype html>')||!game.trimEnd().endsWith('</html>'))throw Error('incomplete game');
m.textContent='冒険を開始します';document.open();document.write(game);document.close();
}catch(e){console.error('Rika Quest:',e);m.textContent='読み込みエラー';document.getElementById('error').style.display='block';}
})();
</script></body></html>
